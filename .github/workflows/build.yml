name: Build & Auto Release MYRA AI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4

    - name: 2. Setup Node.js (v20)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # Cache line hata di gayi hai taake lock file ki zaroorat na pade

    - name: 3. Install Dependencies
      run: npm install

    - name: 4. Build & Convert Icon (Auto JPG to ICO)
      run: npm run dist
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 5. Upload EXE as Artifact (Backup)
      uses: actions/upload-artifact@v4
      with:
        name: MYRA-AI-Windows-App
        path: release/*.exe

    - name: 6. Create GitHub Release & Upload EXE
      uses: softprops/action-gh-release@v2
      with:
        files: release/*.exe
        tag_name: v1.0.${{ github.run_number }}
        name: MYRA AI Setup v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
